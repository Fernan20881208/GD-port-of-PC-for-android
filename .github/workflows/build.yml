name: Build Android64

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse mod.json
        run: python -m json.tool mod.json > /dev/null

  build:
    name: Android64
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          combine: true

  package:
    name: Package .geode
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Android64 build output
        uses: actions/download-artifact@v4
        with:
          name: geode-build-android64
          path: package

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloaded files:"
          find package -maxdepth 2 -type f -print
          test -n "$(find package -type f -name '*.geode' -print -quit)"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: GD-PC-Experience-Android64
          path: package/*.geode
          if-no-files-found: error

name: Build PC-FPS-MOD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate mod.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('mod.json').read_text(encoding='utf-8'))
          required = ['geode', 'gd', 'id', 'name', 'version', 'developer']
          missing = [key for key in required if key not in data]
          if missing:
              raise SystemExit(f'Missing required mod.json keys: {missing}')
          if data['name'] != 'PC-FPS-MOD':
              raise SystemExit('The public mod name must be PC-FPS-MOD')
          if len(data.get('description', '')) > 45:
              raise SystemExit('mod.json description must be 45 characters or fewer')
          for platform in ('android', 'ios'):
              if data['gd'].get(platform) != '2.2081':
                  raise SystemExit(f'{platform} GD target must be 2.2081')
          print('mod.json metadata looks valid for Android64 and iOS')
          PY

  build:
    name: ${{ matrix.config.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            os: ubuntu-latest
            target: Android64
            artifact: geode-build-android64
          - name: iOS arm64
            os: macos-latest
            target: iOS
            artifact: geode-build-ios
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "5.10.1"
          build-config: Release
          target: ${{ matrix.config.target }}
          combine: false
      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error

  package:
    name: Validate and combine packages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: write
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine
      - name: Validate universal .geode
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.combine.outputs.build-output }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          output = Path(os.environ['PACKAGE_PATH'])
          candidates = [output] if output.is_file() else list(output.rglob('*.geode'))
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one combined .geode, found {len(candidates)}')

          package = candidates[0]
          with zipfile.ZipFile(package, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP entry: {bad}')
              names = set(zf.namelist())
              metadata = json.loads(zf.read('mod.json').decode('utf-8'))
              mod_id = metadata['id']
              expected = {
                  f'{mod_id}.android64.so',
                  f'{mod_id}.ios.dylib',
              }
              missing = sorted(expected - names)
              if missing:
                  raise SystemExit(f'Combined package is missing: {missing}')
              if metadata.get('name') != 'PC-FPS-MOD':
                  raise SystemExit('Combined package has the wrong public name')
              if metadata.get('gd', {}).get('android') != '2.2081':
                  raise SystemExit('Combined package has the wrong Android target')
              if metadata.get('gd', {}).get('ios') != '2.2081':
                  raise SystemExit('Combined package has the wrong iOS target')
              print(f'Validated {package}: Android64 + iOS arm64')
          PY
      - name: Upload universal package
        uses: actions/upload-artifact@v4
        with:
          name: PC-FPS-MOD-Android64-iOS
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error
